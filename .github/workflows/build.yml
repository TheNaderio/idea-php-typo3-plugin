# Builds and tests the three plugins against the IntelliJ Platform version
# declared as `platformVersion` in gradle.properties.

name: Build

on: [ push, pull_request ]

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  # Verify the Gradle wrapper's checksum before running it
  gradleValidation:
    name: Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4

  test:
    name: Test
    needs: gradleValidation
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew check

      - name: Verify Plugin Structure
        run: ./gradlew verifyPluginStructure

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests
            */build/test-results
          if-no-files-found: ignore

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.properties.outputs.version }}
      prefixed-version: ${{ steps.properties.outputs.prefixed-version }}
      changelog: ${{ steps.properties.outputs.changelog }}
      cms-artifact: ${{ steps.properties.outputs.cms-artifact }}
      fluid-artifact: ${{ steps.properties.outputs.fluid-artifact }}
      typoscript-artifact: ${{ steps.properties.outputs.typoscript-artifact }}

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^pluginVersion:" | cut -f2- -d ' ')"
          CUSTOM_SINCE_BUILD="$(echo "$PROPERTIES" | grep "^customSinceBuild:" | cut -f2- -d ' ')"
          PREFIXED_VERSION="${CUSTOM_SINCE_BUILD}${VERSION:1}"

          CMS_NAME="$(echo "$PROPERTIES" | grep "^pluginNameCMS:" | cut -f2- -d ' ')"
          FLUID_NAME="$(echo "$PROPERTIES" | grep "^pluginNameFluid:" | cut -f2- -d ' ')"
          TYPOSCRIPT_NAME="$(echo "$PROPERTIES" | grep "^pluginNameTypoScript:" | cut -f2- -d ' ')"

          {
            echo "version=$VERSION"
            echo "prefixed-version=$PREFIXED_VERSION"
            echo "cms-artifact=${CMS_NAME}-${PREFIXED_VERSION}.zip"
            echo "fluid-artifact=${FLUID_NAME}-${PREFIXED_VERSION}.zip"
            echo "typoscript-artifact=${TYPOSCRIPT_NAME}-${PREFIXED_VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

          # Multi-line value: use the heredoc form of $GITHUB_OUTPUT
          {
            echo "changelog<<CHANGELOG_EOF"
            ./gradlew :getChangelog --unreleased --no-header --console=plain -q
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Plugin
        shell: bash
        env:
          ORG_GRADLE_PROJECT_pluginVersion: ${{ steps.properties.outputs.prefixed-version }}
        run: ./gradlew buildPlugin

      - name: Upload CMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-plugin-artifact
          path: ./typo3-cms/build/distributions/${{ steps.properties.outputs.cms-artifact }}
          if-no-files-found: error

      - name: Upload Fluid artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluid-plugin-artifact
          path: ./lang-fluid/build/distributions/${{ steps.properties.outputs.fluid-artifact }}
          if-no-files-found: error

      - name: Upload TypoScript artifact
        uses: actions/upload-artifact@v4
        with:
          name: typoscript-plugin-artifact
          path: ./lang-typoscript/build/distributions/${{ steps.properties.outputs.typoscript-artifact }}
          if-no-files-found: error

  # Run the IntelliJ Plugin Verifier against the IDEs configured in
  # intellijPlatform.pluginVerification of each module
  verify:
    name: Verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload Verifier Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: '*/build/reports/pluginVerifier'
          if-no-files-found: ignore

  # Prepare a draft release for the GitHub Releases page for manual verification.
  # Publishing it triggers the release workflow.
  releaseDraft:
    name: Release Draft
    if: github.event_name != 'pull_request'
    needs: [ build, verify ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Remove Old Release Drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json id,tagName,isDraft \
            | jq -r '.[] | select(.isDraft) | .tagName' \
            | xargs -r -I '{}' gh release delete '{}' --yes

      - name: Create Release Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --title "v${{ needs.build.outputs.version }}" \
            --notes "$CHANGELOG"
