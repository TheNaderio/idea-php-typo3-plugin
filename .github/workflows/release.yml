# Handles the release process based on the draft release prepared by the Build workflow.
# Running the publishPlugin task requires the PUBLISH_TOKEN secret.

name: Release

on:
  release:
    types: [ prereleased, released ]

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  # Prepare and publish the plugins to the Marketplace
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest

    outputs:
      prefixed-version: ${{ steps.properties.outputs.prefixed-version }}

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^pluginVersion:" | cut -f2- -d ' ')"
          CUSTOM_SINCE_BUILD="$(echo "$PROPERTIES" | grep "^customSinceBuild:" | cut -f2- -d ' ')"

          echo "prefixed-version=${CUSTOM_SINCE_BUILD}${VERSION:1}" >> "$GITHUB_OUTPUT"

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          ORG_GRADLE_PROJECT_pluginVersion: ${{ steps.properties.outputs.prefixed-version }}
        shell: bash
        run: |
          ./gradlew :typo3-cms:publishPlugin :lang-fluid:publishPlugin :lang-typoscript:publishPlugin

  # Move the [Unreleased] section of the changelog into a released one, then push it back
  changelog:
    name: Update Changelog
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # patchChangelog lives on the root project - the changelog plugin is applied there only
      - name: Patch Changelog
        run: ./gradlew :patchChangelog

      - name: Commit and Push
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to push."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update changelog" -- CHANGELOG.md
          git push origin HEAD:master
