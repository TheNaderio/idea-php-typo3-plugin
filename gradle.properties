pluginGroup = com.cedricziel.idea

pluginNameCMS = TYPO3 CMS Support
pluginNameFluid = TYPO3 Fluid Support
pluginNameTypoScript = TYPO3 TypoScript Support
pluginVersion = 0.9.3

# IntelliJ Platform 2026.2+ setzt Java 25 voraus
javaVersion = 25

# Zielplattform: PhpStorm 2026.2.1 == Branch 262
platformVersion = 2026.2.1
customSinceBuild = 262
# Kein untilBuild: seit Plattform 243+ empfiehlt JetBrains offene Vorwaerts-
# kompatibilitaet, damit Nutzer das Plugin nach einem IDE-Update behalten.

org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

kotlin.stdlib.default.dependency = false
