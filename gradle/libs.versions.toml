[versions]
# IntelliJ Platform Gradle Plugin 2.x — Nachfolger von org.jetbrains.intellij 1.x
intellijPlatform = "2.18.1"
changelog = "2.5.0"
junit4 = "4.13.2"

[plugins]
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
# GrammarKit ist seit 2023.3.0.4 kein eigenstaendiges Plugin mehr, sondern ein IPGP-Subplugin
intellijPlatformGrammarKit = { id = "org.jetbrains.intellij.platform.grammarkit", version.ref = "intellijPlatform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }
